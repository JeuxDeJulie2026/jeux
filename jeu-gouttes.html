<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeux de Julie - Le Jeu de la Souris</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #2c3e50;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: white;
            overflow: hidden;
        }

        h1 {
            margin: 10px 0;
            font-size: 24px;
        }

        #score-container {
            font-size: 18px;
            margin-bottom: 10px;
        }

        /* Zone de jeu responsive pour s'adapter aux téléphones */
        #game-board {
            position: relative;
            width: 90vw;
            max-width: 400px;
            height: 60vh;
            max-height: 500px;
            background-color: #34495e;
            border: 4px solid #3498db;
            border-radius: 10px;
            overflow: hidden;
            touch-action: none; /* Empêche l'écran de bouger sur téléphone */
        }

        /* Éléments du jeu */
        #mouse {
            position: absolute;
            bottom: 20px;
            left: 50%;
            width: 50px;
            height: 40px;
            background-color: #95a5a6;
            border-radius: 50% 50% 20% 20%;
            transform: translateX(-50%);
            transition: left 0.05s ease-out; /* Plus réactif aux mouvements */
        }

        /* Les deux petits ronds roses au-dessus de la souris (ses oreilles) */
        #mouse::before, #mouse::after {
            content: '';
            position: absolute;
            top: -10px;
            width: 15px;
            height: 15px;
            background-color: #ff9ff3;
            border-radius: 50%;
        }
        #mouse::before { left: 5px; }
        #mouse::after { right: 5px; }

        /* L'œil de la souris */
        .eye {
            position: absolute;
            top: 10px;
            left: 22px;
            width: 6px;
            height: 6px;
            background-color: #000;
            border-radius: 50%;
        }

        .cheese {
            position: absolute;
            width: 30px;
            height: 30px;
            background-color: #f1c40f;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%); /* Forme de triangle */
            border-radius: 5px;
        }

        #btn-retour {
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <h1>Le Jeu de la Souris 🐭</h1>
    <div id="score-container">
        Score : <span id="score">0</span> | Vies : <span id="lives">❤️❤️❤️</span>
    </div>

    <div id="game-board">
        <div id="mouse"><div class="eye"></div></div>
    </div>

    <a href="page-jeu.html" id="btn-retour">Retour aux jeux</a>

    <script>
        const board = document.getElementById('game-board');
        const mouse = document.getElementById('mouse');
        const scoreDisplay = document.getElementById('score');
        const livesDisplay = document.getElementById('lives');

        let score = 0;
        let lives = 3;
        let mouseX = board.clientWidth / 2;

        // Déplacement de la souris adapté pour aller jusqu'au bout des bords
        function moveMouse(e) {
            const rect = board.getBoundingClientRect();
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let relativeX = clientX - rect.left;

            // Ajustement des limites : permet à la tête d'atteindre le ras du mur
            if (relativeX < 15) relativeX = 15;
            if (relativeX > rect.width - 15) relativeX = rect.width - 15;

            mouseX = relativeX;
            mouse.style.left = mouseX + 'px';
        }

        board.addEventListener('mousemove', moveMouse);
        board.addEventListener('touchmove', moveMouse, { passive: false });

        // Fonction pour faire tomber les fromages
        function createCheese() {
            if (lives <= 0) return;

            const cheese = document.createElement('div');
            cheese.classList.add('cheese');
            
            // Position aléatoire en largeur (légèrement resserrée pour coller à la nouvelle limite)
            const randomX = 5 + Math.random() * (board.clientWidth - 40);
            cheese.style.left = randomX + 'px';
            cheese.style.top = '0px';
            board.appendChild(cheese);

            let cheeseY = 0;
            const fallSpeed = 3 + Math.random() * 3;

            const interval = setInterval(() => {
                if (lives <= 0) {
                    clearInterval(interval);
                    cheese.remove();
                    return;
                }

                cheeseY += fallSpeed;
                cheese.style.top = cheeseY + 'px';

                // Détection de collision
                const mouseRect = mouse.getBoundingClientRect();
                const cheeseRect = cheese.getBoundingClientRect();

                if (
                    cheeseRect.bottom >= mouseRect.top &&
                    cheeseRect.right >= mouseRect.left &&
                    cheeseRect.left <= mouseRect.right &&
                    cheeseRect.top <= mouseRect.bottom
                ) {
                    score += 10;
                    scoreDisplay.textContent = score;
                    clearInterval(interval);
                    cheese.remove();
                }

                // Si le fromage touche le bas
                if (cheeseY > board.clientHeight) {
                    clearInterval(interval);
                    cheese.remove();
                    lives--;
                    livesDisplay.textContent = '❤️'.repeat(lives);

                    if (lives === 0) {
                        alert("Partie terminée ! Votre score : " + score);
                        resetGame();
                    }
                }
            }, 20);
        }

        function resetGame() {
            score = 0;
            lives = 3;
            scoreDisplay.textContent = score;
            livesDisplay.textContent = '❤️❤️❤️';
        }

        // Générer un fromage toutes les 1.2 secondes
        setInterval(createCheese, 1200);
    </script>
</body>
</html>
