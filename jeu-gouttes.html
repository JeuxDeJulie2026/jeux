        .score-board {
            color: #FFDC00;

            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .vies-board {

            font-size: 3.5rem;
            color: #FF4136;
            margin-bottom: 20px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        .btn-rejouer {
            padding: 15px 30px;
            font-size: 1.3rem;
            background-color: #2ECC40;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .fromage {
            position: absolute;
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #FFDC00; 
            top: -40px;
        }

        .fromage::after {
            content: '';
            position: absolute;
            top: -25px;
            left: -5px;
            width: 4px;
            height: 4px;
            background-color: #D1A100;
            border-radius: 50%;
            box-shadow: 8px 5px 0 #D1A100, -4px 10px 0 #D1A100;
        }

        #souris-conteneur {
            position: absolute;
            bottom: 40px;
            width: 90px;
            height: 110px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .corps-souris {
            width: 60px;
            height: 60px;
            background-color: #A0A0A0;
            border-radius: 50%;
            position: relative;
            z-index: 2;
        }

        .bouche-ouverte {
            position: absolute;
            top: 10px;
            left: 20px;
            width: 20px;
            height: 16px;
            background-color: #4A0000;
            border-radius: 50% 50% 30% 30%;
            border-bottom: 3px solid #FFB6C1;
        }

        .oeil {
            position: absolute;
            top: 32px;
            width: 6px;
            height: 6px;
            background-color: black;
            border-radius: 50%;
        }
        .oeil-gauche { left: 18px; }
        .oeil-droite { left: 36px; }

        .zone-oreilles {
            display: flex;
            gap: 10px;
            margin-top: -10px;
            z-index: 1;
        }

        .oreille {
            width: 28px;
            height: 28px;
            background-color: #A0A0A0;
            border-radius: 50%;
            position: relative;
        }

        .oreille::after {
            content: '';
            position: absolute;
            top: 5px;
            left: 5px;
            width: 18px;
            height: 18px;
            background-color: #FFB6C1;
            border-radius: 50%;
        }
    </style>

<body>

    <div class="hud">
        <div class="score-board">Fromages mangés : <span id="score">0</span></div>
        <div class="vies-board">Vies : <span id="vies">💖 💖 💖</span></div>
    </div>
    
    <a href="page-jeu.html" class="btn-retour">📁 Menu</a>

    <div id="game-over-screen">
        <h2>GAME OVER</h2>
        <p style="font-size: 1.3rem; margin-bottom: 30px;">La souris a trop faim !</p>
        <button class="btn-rejouer" onclick="recommencerPartie()">Recommencer</button>
    </div>

    <div id="souris-conteneur">
        <div class="corps-souris">
            <div class="bouche-ouverte"></div>
            <div class="oeil oeil-gauche"></div>
            <div class="oeil oeil-droite"></div>
        </div>
        <div class="zone-oreilles">
            <div class="oreille"></div>
            <div class="oreille"></div>
        </div>
    </div>

    <div id="monFromage" class="fromage"></div>

    <script>
        let score = 0;
        let vies = 3;
        let jeuActif = true;
        let vitesseInitiale = 4;
        let vitesseFromage = vitesseInitiale;

        const souris = document.getElementById('souris-conteneur');
        const fromage = document.getElementById('monFromage');
        const affichageScore = document.getElementById('score');
        const affichageVies = document.getElementById('vies');
        const ecranGameOver = document.getElementById('game-over-screen');

        let fromageX = Math.random() * (window.innerWidth - 60) + 30;
        let fromageY = -40;

        // Fonction ajustée pour permettre à la bouche d'atteindre le bord de l'écran
        function deplacerPersonnage(axeX) {
            if (!jeuActif) return;
            // Ajustement des limites de 45px à 5px pour aller jusqu'au bout des deux côtés
            if (axeX > 5 && axeX < window.innerWidth - 5) {
                souris.style.left = axeX + 'px';
            }
        }

        // 1. Déplacement pour ORDINATEUR (Souris)
        window.addEventListener('mousemove', (evenement) => {
            let x = evenement.clientX;
            let y = evenement.clientY;

            if (x > window.innerWidth - 150 && y < 80) {
                document.body.style.cursor = 'default';
            } else if (jeuActif) {
                document.body.style.cursor = 'none';
            }
            deplacerPersonnage(x);
        });

        // 2. Déplacement pour TÉLÉPHONE (Doigt tactile)
        window.addEventListener('touchmove', (evenement) => {
            let xTactile = evenement.touches[0].clientX;
            deplacerPersonnage(xTactile);
        }, { passive: true });

        window.addEventListener('touchstart', (evenement) => {
            let xTactile = evenement.touches[0].clientX;
            deplacerPersonnage(xTactile);
        }, { passive: true });

        function animerJeu() {
            if (!jeuActif) return;

            fromageY += vitesseFromage;
            
            if (fromageY > window.innerHeight) {
                vies--;
                mettreAJourVies();
                
                if (vies <= 0) {
                    finDePartie();
                } else {
                    remettreFromageEnHaut();
                }
            }

            let limitesSouris = souris.getBoundingClientRect();
            
            if (fromageY >= limitesSouris.top && fromageY <= limitesSouris.top + 30) {
                if (fromageX >= limitesSouris.left - 25 && fromageX <= limitesSouris.right + 25) {
                    score++;
                    affichageScore.innerText = score;
                    vitesseFromage += 0.4;
                    remettreFromageEnHaut();
                }
            }

            fromage.style.top = fromageY + 'px';
            fromage.style.left = fromageX + 'px';

            requestAnimationFrame(animerJeu);
        }

        function remettreFromageEnHaut() {
            fromageY = -40;
            // Le fromage descend de façon un peu plus centrale pour éviter de raser les murs
            fromageX = Math.random() * (window.innerWidth - 60) + 30;
        }

        function mettreAJourVies() {
            let coeurs = "";
            for (let i = 0; i < vies; i++) {
                coeurs += "💖 ";
            }
            affichageVies.innerText = coeurs || "💔 Aucun";
        }

        function finDePartie() {
            jeuActif = false;
            document.body.style.cursor = 'default';
            ecranGameOver.style.display = 'flex';
        }

        function recommencerPartie() {
            score = 0;
            vies = 3;
            vitesseFromage = vitesseInitiale;
            jeuActif = true;
            document.body.style.cursor = 'none';
            affichageScore.innerText = score;
            mettreAJourVies();
            ecranGameOver.style.display = 'none';
            remettreFromageEnHaut();
            animerJeu();
        }

        animerJeu();
    </script>
</body>
