<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Laboratoire Secret - Les Jeux de Julie</title>
 
    <!-- LE PONT INVISIBLE VERS TON RECUEIL DE STYLE -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="scene" class="scene-container">
        
        <!-- Le Soleil bouton magique -->
        <div class="soleil-bouton" id="boutonSoleil">ENTRER</div>

        <!-- LES 2 ARBRES DE FOND -->
        <div class="arbre-conteneur arbre-fond-1"><div class="feuilles-fond"></div><div class="arbre-tronc"></div></div>
        <div class="arbre-conteneur arbre-fond-2"><div class="feuilles-fond" style="background-color: #1B5E20; width: 250px;"></div><div class="arbre-tronc"></div></div>

        <!-- LE DÉCOR DU BAS -->
        <div class="zone-herbe">
            <div class="sentier-sinueux"></div>
            <div class="roche-grosse" style="width: 35px; height: 22px; top: 12%; left: 24%;"></div>
            <div class="roche-grosse" style="width: 42px; height: 26px; top: 55%; left: 45%;"></div>
            <div class="roche-grosse" style="width: 30px; height: 18px; top: 25%; left: 75%;"></div>
        </div>

        <!-- LE DÉFILÉ DES ZÈBRES -->
        <div class="defile-animaux">
            <div class="un-animaux bebe-z">🦓</div>
            <div class="un-animaux maman-z">🦓</div>
        </div>

        <!-- LE PETIT COCHON EN RETARD -->
        <div class="cochon-sprinteur">
            <div class="cochon-corps">🐖</div>
        </div>

        <!-- LA FLEUR À PÉTALES ROUGES -->
        <div class="fleur-conteneur">
            <div class="tête-fleur"><div class="coeur-fleur"></div><div class="petale p1"></div><div class="petale p2"></div><div class="petale p3"></div><div class="petale p4"></div></div>
            <div class="tige"></div>
        </div>

        <!-- LES 2 GROS ARBRES DE PREMIER PLAN -->
        <div class="arbre-conteneur arbre-premier-gauche"><div class="feuilles-premier-plan-gauche"></div><div class="arbre-tronc"></div></div>
        <div class="arbre-conteneur arbre-premier-droite"><div class="feuilles-premier-plan-droite"></div><div class="arbre-tronc"></div></div>

    </div>

    <!-- CONFIGURATION DES SONS MP3 -->
    <audio id="sonBranche" src="branche.mp3"></audio>
    <audio id="sonCochon" src="cochon.mp3"></audio>
    <audio id="sonVent" src="vent.mp3"></audio>

        <script>
        document.querySelector('.soleil-bouton').onclick = function() {
            
            document.querySelector('.scene-container').classList.add('anime-active');
            
            // 🚀 ON PROGRAMME LES ANIMATIONS DIRECTES ICI
            document.querySelector('.defile-animaux').style.animation = "marcherZebres 9s linear forwards";
            document.querySelector('.cochon-sprinteur').style.animation = "courirCochon 3.5s linear 7.5s forwards";
            
            // 1. Les zèbres démarrent tout de suite
            setTimeout(function() { 
                document.getElementById("sonBranche").play(); 
            }, 0);
            
            // 2. Le cochon démarre quand le dernier zèbre est au milieu
            setTimeout(function() { 
                document.getElementById("sonCochon").play(); 
            }, 7800);

            // 3. Le cochon arrive sur la fleur -> Le vent souffle ET la fleur se plie !
            setTimeout(function() { 
                document.getElementById("sonVent").play(); 
                // 🌸 ON ACTIVE LE PLIAGE DE LA FLEUR POUR TOUS LES ÉCRANS
                document.querySelector('.fleur-conteneur').classList.add('fleur-pliee');
            }, 9800);

            // 4. Redirection automatique vers le menu des jeux
            setTimeout(function() {
                window.location.href = "page-jeu.html";
            }, 12500);
        };
    </script>

</body>
</html>
