<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Les Jeux de Julie</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        /* Le rideau bleu accéléré à 8 secondes */
        .rideau-bleu {
            position: fixed;
            top: -100%;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0074D9;
            animation: descendreDoucement 8s forwards;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        h1 {
            color: white;
            font-size: 3rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .lien-fleur {
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 200px;
            justify-content: flex-start;
        }

        .fleur-bloc {
            position: relative;
            width: 100px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* La tige apparaît à 8s */
        .tige {
            width: 8px;
            height: 60px;
            background-color: #2ECC40;
            opacity: 0;
            animation: apparaitre 0.4s 8s forwards;
            margin-top: -10px;
        }

        /* Le cœur jaune apparaît à 8.5s */
        .coeur {
            width: 30px;
            height: 30px;
            background-color: #FFDC00;
            border-radius: 50%;
            z-index: 5;
            position: absolute;
            opacity: 0;
            animation: apparaitre 0.4s 8.5s forwards;
        }

        .petale {
            position: absolute;
            width: 28px;
            height: 28px;
            background-color: #FF4136;
            border-radius: 50%;
            opacity: 0;
            z-index: 4;
        }

        /* --- SÉQUENCE EN SENS HORAIRE --- */
        
        /* 1. Haut (Midi) à 9s */
        .p1 { top: 12px; animation: apparaitre 0.4s 9s forwards; }
        
        /* 2. Droite (3h) à 9.4s */
        .p4 { right: 12px; animation: apparaitre 0.4s 9.4s forwards; }
        
        /* 3. Bas (6h) à 9.8s */
        .p2 { bottom: 12px; animation: apparaitre 0.4s 9.8s forwards; }
        
        /* 4. Gauche (9h) à 10.2s */
        .p3 { left: 12px; animation: apparaitre 0.4s 10.2s forwards; }

        /* Texte final à 11s */
        .clic-texte {
            color: #FFDC00;
            font-weight: bold;
            font-size: 1.3rem;
            margin-top: 15px;
            opacity: 0;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            animation: apparaitre 0.6s 11s forwards;
        }

        @keyframes descendreDoucement {
            to { top: 0; }
        }

        @keyframes apparaitre {
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="rideau-bleu">
        
        <h1>Jeux de Julie</h1>

        <a href="page-jeu.html" class="lien-fleur">
            <div class="fleur-bloc">
                <div class="coeur"></div>
                <!-- Les pétales sont placés dans l'ordre de leur apparition -->
                <div class="petale p1"></div>
                <div class="petale p4"></div>
                <div class="petale p2"></div>
                <div class="petale p3"></div>
            </div>
            <div class="tige"></div>
            <div class="clic-texte">Clique ici !</div>
        </a>

    </div>

</body>
</html>
