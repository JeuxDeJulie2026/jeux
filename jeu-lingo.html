<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Jeu Lingo</title>
    <style>
        body {
            margin: 0;
            padding: 10px;
            min-height: 100vh;
            background-color: #001f3f;
            font-family: Arial, sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            position: relative;
            box-sizing: border-box;
        }

        h1 {
            color: #FFDC00;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin-top: 60px;
            margin-bottom: 5px;
            font-size: 2rem;
        }

        p {
            margin-top: 0;
            margin-bottom: 15px;
            color: #7FDBFF;
            font-size: 1rem;
        }

        /* Bouton Menu en haut à droite */
        .btn-retour {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 8px 15px;
            background-color: #FFDC00;
            color: #001f3f;
            text-decoration: none;
            border-radius: 12px;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            transition: background-color 0.2s, color 0.2s, transform 0.2s;
        }

        .btn-retour:hover {
            transform: scale(1.05);
            background-color: #FF851B;
            color: white;
        }

        /* Zone centrale : Grille + Légende côte à côte */
        .zone-jeu {
            display: flex;
            align-items: center;
            gap: 30px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 500px;
        }

        /* Grille pour les tentatives de mots */
        .grille-lingo {
            display: grid;
            grid-template-rows: repeat(6, 1fr);
            gap: 8px;
        }

        .ligne-mot {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }

        .lettre {
            width: 45px;
            height: 45px;
            border: 2px solid #7FDBFF;
            border-radius: 8px;
            font-size: 1.6rem;
            font-weight: bold;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(255, 255, 255, 0.05);
            transition: background-color 0.4s;
            color: white;
        }

        /* Panneau Explication des Couleurs (PC) */
        .legende-couleurs {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            max-width: 240px;
        }

        .item-legende {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .item-legende:last-child {
            margin-bottom: 0;
        }

        .pastille {
            width: 20px;
            height: 20px;
            border-radius: 5px;
            flex-shrink: 0;
        }

        /* Styles pour les indices de couleur */
        .correct { background-color: #2ECC40 !important; border-color: #2ECC40 !important; } 
        .mal-place { background-color: #FF851B !important; border-color: #FF851B !important; } 
        .incorrect { background-color: #FF4136 !important; border-color: #FF4136 !important; } 

        /* Clavier Virtuel */
        .clavier-virtuel {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
            max-width: 460px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        .ligne-clavier {
            display: flex;
            justify-content: center;
            gap: 4px;
            width: 100%;
        }

        .touche {
            background-color: #7FDBFF;
            color: #001f3f;
            border: none;
            border-radius: 6px;
            padding: 12px 0;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            flex: 1;
            text-align: center;
            user-select: none;
            transition: background-color 0.1s;
        }

        .touche:active {
            background-color: #FF851B;
            color: white;
        }

        .touche-large {
            flex: 1.5;
            background-color: #FFDC00;
        }

        /* 📱 AJUSTEMENTS SÉCURITÉ POUR ÉCRANS MOBILES (Téléphones) */
        @media (max-width: 600px) {
            h1 { margin-top: 50px; font-size: 1.6rem; }
            p { margin-bottom: 8px; font-size: 0.9rem; }
            
            /* 1. On cache la grosse boîte de légende grise pour gagner toute la hauteur ! */
            .legende-couleurs {
                display: none;
            }

            /* 2. On réduit légèrement la taille des carrés de la grille */
            .lettre {
                width: 38px;
                height: 38px;
                font-size: 1.3rem;
                border-radius: 6px;
            }

            /* 3. On force le clavier à occuper proprement la largeur sans déborder à gauche */
            .clavier-virtuel {
                padding: 0 4px;
                gap: 5px;
            }
            .ligne-clavier {
                gap: 3px;
            }
            .touche {
                padding: 10px 0;
                font-size: 0.85rem; /* Un tout petit peu plus petit pour le Q-W-E-R-T-Y-U-I-O-P */
                border-radius: 4px;
            }
        }
    </style>
</head>
