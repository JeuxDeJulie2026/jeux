<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Jeu Lingo</title>
    <style>
        body { margin: 0; padding: 10px; min-height: 100vh; background-color: #001f3f; font-family: Arial, sans-serif; color: white; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; position: relative; box-sizing: border-box; }
        h1 { color: #FFDC00; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); margin-top: 60px; margin-bottom: 5px; font-size: 2rem; }
        p { margin-top: 0; margin-bottom: 15px; color: #7FDBFF; font-size: 1rem; }
        .btn-retour { position: absolute; top: 15px; right: 15px; padding: 8px 15px; background-color: #FFDC00; color: #001f3f; text-decoration: none; border-radius: 12px; font-weight: bold; font-size: 0.9rem; }
        .btn-retour:hover { background-color: #FF851B; color: white; }
        .zone-jeu { display: flex; align-items: center; gap: 20px; margin-bottom: 15px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 500px; }
        .grille-lingo { display: grid; grid-template-rows: repeat(6, 1fr); gap: 8px; }
        .ligne-mot { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
        .lettre { width: 45px; height: 45px; border: 2px solid #7FDBFF; border-radius: 8px; font-size: 1.6rem; font-weight: bold; text-transform: uppercase; display: flex; align-items: center; justify-content: center; background-color: rgba(255, 255, 255, 0.05); color: white; }
        .legende-couleurs { background-color: rgba(255, 255, 255, 0.1); padding: 15px; border-radius: 12px; max-width: 240px; }
        .item-legende { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 0.9rem; }
        .pastille { width: 20px; height: 20px; border-radius: 5px; flex-shrink: 0; }
        .correct { background-color: #2ECC40 !important; border-color: #2ECC40 !important; } 
        .mal-place { background-color: #FF851B !important; border-color: #FF851B !important; } 
        .incorrect { background-color: #FF4136 !important; border-color: #FF4136 !important; } 
        .clavier-virtuel { display: flex; flex-direction: column; gap: 6px; width: 100%; max-width: 460px; margin-top: 5px; box-sizing: border-box; }
        .ligne-clavier { display: flex; justify-content: center; gap: 4px; width: 100%; }
        .touche { background-color: #7FDBFF; color: #001f3f; border: none; border-radius: 6px; padding: 12px 0; font-size: 1.1rem; font-weight: bold; cursor: pointer; flex: 1; text-align: center; user-select: none; }
        .touche:active { background-color: #FF851B; color: white; }
        .touche-large { flex: 1.5; background-color: #FFDC00; }
        @media (max-width: 600px) {
            h1 { margin-top: 50px; font-size: 1.6rem; }
            .legende-couleurs { display: none; }
            .lettre { width: 38px; height: 38px; font-size: 1.3rem; }
            .clavier-virtuel { padding: 0 4px; gap: 5px; }
            .ligne-clavier { gap: 3px; }
            .touche { padding: 10px 0; font-size: 0.85rem; }
        }
    </style>
</head>
<body>
    <body>
    <a href="page-jeu.html" class="btn-retour">✉️ Menu</a>
    <h1>Jeu Lingo</h1>
    <p>Devinez le mot secret en 5 lettres !</p>
    
    <div class="zone-jeu">
        <div class="grille-lingo" id="grille"></div>
        <!-- Cette boîte s'affiche uniquement sur PC -->
        <div class="legende-couleurs">
            <h3 style="margin-top: 0; color: #FFDC00; font-size: 1.1rem; margin-bottom: 15px;">Signification :</h3>
            <div class="item-legende"><div class="pastille correct"></div><span>Bonne place !</span></div>
            <div class="item-legende"><div class="pastille mal-place"></div><span>Mal placée.</span></div>
            <div class="item-legende"><div class="pastille incorrect"></div><span>N'existe pas.</span></div>
        </div>
    </div>

    <!-- Le clavier virtuel -->
    <div class="clavier-virtuel">
        <div class="ligne-clavier">
            <button class="touche" onclick="taperLettre('Q')">Q</button><button class="touche" onclick="taperLettre('W')">W</button><button class="touche" onclick="taperLettre('E')">E</button><button class="touche" onclick="taperLettre('R')">R</button><button class="touche" onclick="taperLettre('T')">T</button><button class="touche" onclick="taperLettre('Y')">Y</button><button class="touche" onclick="taperLettre('U')">U</button><button class="touche" onclick="taperLettre('I')">I</button><button class="touche" onclick="taperLettre('O')">O</button><button class="touche" onclick="taperLettre('P')">P</button>
        </div>
        <div class="ligne-clavier">
            <button class="touche" onclick="taperLettre('A')">A</button><button class="touche" onclick="taperLettre('S')">S</button><button class="touche" onclick="taperLettre('D')">D</button><button class="touche" onclick="taperLettre('F')">F</button><button class="touche" onclick="taperLettre('G')">G</button><button class="touche" onclick="taperLettre('H')">H</button><button class="touche" onclick="taperLettre('J')">J</button><button class="touche" onclick="taperLettre('K')">K</button><button class="touche" onclick="taperLettre('L')">L</button>
        </div>
        <div class="ligne-clavier">
            <button class="touche touche-large" onclick="effacerLettre()">⌫</button><button class="touche" onclick="taperLettre('Z')">Z</button><button class="touche" onclick="taperLettre('X')">X</button><button class="touche" onclick="taperLettre('C')">C</button><button class="touche" onclick="taperLettre('V')">V</button><button class="touche" onclick="taperLettre('B')">B</button><button class="touche" onclick="taperLettre('N')">N</button><button class="touche" onclick="taperLettre('M')">M</button><button class="touche touche-large" onclick="validerMot()">OK</button>
        </div>
    </div>

    <!-- 📱 Petite légende compacte ajoutée juste sous le clavier pour le téléphone -->
    <div style="margin-top: 15px; display: flex; gap: 15px; font-size: 0.8rem; justify-content: center; flex-wrap: wrap;">
        <div style="display: flex; align-items: center; gap: 5px;"><div style="width: 12px; height: 12px; background-color: #2ECC40; border-radius: 3px;"></div><span>Bonne place</span></div>
        <div style="display: flex; align-items: center; gap: 5px;"><div style="width: 12px; height: 12px; background-color: #FF851B; border-radius: 3px;"></div><span>Mal placée</span></div>
        <div style="display: flex; align-items: center; gap: 5px;"><div style="width: 12px; height: 12px; background-color: #FF4136; border-radius: 3px;"></div><span>Inexistant</span></div>
    </div>

    <script>
        const NOMBRE_ESSAIS = 6; const LONGUEUR_MOT = 5; const grille = document.getElementById('grille');
        const LISTE_MOTS = ["SAPIN", "GRIVE", "MERLE", "HIBOU", "AIGLE", "CYGNE", "LAPIN", "ZEBRE", "HERBE", "POMME", "FLEUR", "FORET", "JOUER", "CHIEN"];
        let motSecret = LISTE_MOTS[Math.floor(Math.random() * LISTE_MOTS.length)];
        let ligneActuelle = 0; let lettreActuelle = 0; let essaiCourant = "";
        for (let i = 0; i < NOMBRE_ESSAIS; i++) {
            const ligne = document.createElement('div'); ligne.className = 'ligne-mot';
            for (let j = 0; j < LONGUEUR_MOT; j++) {
                const caseLettre = document.createElement('div'); caseLettre.className = 'lettre'; caseLettre.id = `case-${i}-${j}`; ligne.appendChild(caseLettre);
            }
            grille.appendChild(ligne);
        }
        function taperLettre(lettre) {
            if (lettreActuelle < LONGUEUR_MOT) {
                const caseActive = document.getElementById(`case-${ligneActuelle}-${lettreActuelle}`); caseActive.textContent = lettre; essaiCourant += lettre; lettreActuelle++;
            }
        }
        function effacerLettre() {
            if (lettreActuelle > 0) {
                lettreActuelle--; essaiCourant = essaiCourant.slice(0, -1); const caseActive = document.getElementById(`case-${ligneActuelle}-${lettreActuelle}`); caseActive.textContent = "";
            }
        }
        function validerMot() {
            if (essaiCourant.length !== LONGUEUR_MOT) { alert("Le mot doit faire exactement 5 lettres !"); return; }
            let lettresSecretesTrouvees = Array(LONGUEUR_MOT).fill(false); let statutsLigne = Array(LONGUEUR_MOT).fill("incorrect");
            for (let j = 0; j < LONGUEUR_MOT; j++) { if (essaiCourant[j] === motSecret[j]) { statutsLigne[j] = "correct"; lettresSecretesTrouvees[j] = true; } }
            for (let j = 0; j < LONGUEUR_MOT; j++) {
                if (statutsLigne[j] === "correct") continue;
                for (let k = 0; k < LONGUEUR_MOT; k++) { if (!lettresSecretesTrouvees[k] && essaiCourant[j] === motSecret[k]) { statutsLigne[j] = "mal-place"; lettresSecretesTrouvees[k] = true; break; } }
            }
            for (let j = 0; j < LONGUEUR_MOT; j++) { const caseCible = document.getElementById(`case-${ligneActuelle}-${j}`); caseCible.classList.add(statutsLigne[j]); }
            if (essaiCourant === motSecret) { setTimeout(() => { alert("🎉 Félicitations Julie ! Tu as trouvé le mot secret : " + motSecret + " !"); recommencerJeu(); }, 300); return; }
            ligneActuelle++; lettreActuelle = 0; essaiCourant = "";
            if (ligneActuelle >= NOMBRE_ESSAIS) { setTimeout(() => { alert("😢 Oh non ! Tu as épuisé tes essais. Le mot était : " + motSecret); recommencerJeu(); }, 300); }
        }
        function recommencerJeu() {
            motSecret = LISTE_MOTS[Math.floor(Math.random() * LISTE_MOTS.length)]; ligneActuelle = 0; lettreActuelle = 0; essaiCourant = "";
            for (let i = 0; i < NOMBRE_ESSAIS; i++) { for (let j = 0; j < LONGUEUR_MOT; j++) { const c = document.getElementById(`case-${i}-${j}`); c.textContent = ""; c.className = 'lettre'; } }
        }
    </script>
</body>
</html>
