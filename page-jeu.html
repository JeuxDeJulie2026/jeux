<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Salon des Jeux de Julie</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: #001f3f;
            font-family: Arial, sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        h1 {
            font-size: 2.5rem;
            color: #FFDC00;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 50px;
        }

        .salon-jeux {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .icone-jeu {
            width: 140px;
            height: 140px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            text-align: center;
            padding: 15px;
        }

        .icone-jeu:hover {
            transform: scale(1.1);
            box-shadow: 0 12px 20px rgba(255,220,0,0.3);
        }

        .jeu1 { background: linear-gradient(135deg, #0074D9, #7FDBFF); }
        .jeu2 { background: linear-gradient(135deg, #2ECC40, #01FF70); }
        .jeu3 { background: linear-gradient(135deg, #B10DC9, #F012BE); }

        .nom-jeu {
            margin-top: 15px;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <h1>Choisissez votre jeu !</h1>

    <div class="salon-jeux">

        <!-- 1. Bouton Souris -->
        <a href="jeu-gouttes.html" class="icone-jeu jeu1">
            <span style="font-size: 3rem;">🐭</span>
            <div class="nom-jeu">La Souris Gourmande</div>
        </a>

        <!-- 2. Bouton Mémoire -->
        <a href="jeu-memoire.html" class="icone-jeu jeu2">
            <span style="font-size: 3rem;">🧠</span>
            <div class="nom-jeu">Le Jeu de Mémoire</div>
        </a>

        <!-- 3. Bouton Devinette (Aiguillage vérifié !) -->
        <a href="jeu-devinette.html" class="icone-jeu jeu3">
            <span style="font-size: 3rem;">❓</span>
            <div class="nom-jeu">Le Jeu de Devinette</div>
        </a>

    </div>

</body>
</html>
